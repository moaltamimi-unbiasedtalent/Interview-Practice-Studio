name: Browser E2E

# Playwright browser smoke for the unified Home → Interview Practice journey.
# Runs on pull requests (a review gate) and on demand. It starts two real
# Streamlit apps (Live OFF on :8501, Live ON on :8502 via INTERVIEW_LIVE_ENABLED,
# both configured in e2e/playwright.config.ts) and installs a browser, so it is a
# separate job from the fast Python/frontend CI. No paid provider calls: the app
# runs without an API key and the smoke exercises navigation, the mode cards
# (including the Live feature flag), the setup form, and a camera-access spy only.
on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the app
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install E2E deps (reproducible)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright smoke (Playwright starts the app)
        working-directory: e2e
        env:
          CI: "true"
        run: npm test

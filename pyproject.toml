[project]
name = "interview-os-coach"
version = "0.1.0"
description = "Prepare for any role. Practise realistically. Improve every answer."
requires-python = ">=3.10"

# Runtime dependencies — the single source of truth. requirements.txt mirrors
# this list for convenience; keep the two consistent.
dependencies = [
    "streamlit>=1.40,<2.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "sqlalchemy>=2.0,<3.0",
    # Career Intelligence: LLM orchestration via LangChain over OpenRouter's
    # OpenAI-compatible API. RAG requirement (Advanced RAG + hybrid search), so
    # the vector store (Chroma) and BM25 are runtime dependencies, not optional.
    "langchain>=0.3,<0.4",
    "langchain-openai>=0.2,<0.4",
    "pypdf>=4.0,<6.0",
    "chromadb>=0.5,<1.0",
    "rank-bm25>=0.2,<1.0",
]

[project.optional-dependencies]
# Test/development tooling. Install with:  pip install -e ".[dev]"
dev = [
    "pytest>=8.3,<9.0",
    "pytest-mock>=3.14,<4.0",
    "fpdf2>=2.7,<3.0",
]
# Speech-to-text (recorded voice answers). Optional: the base app runs without
# it, and the provider lazily imports it so a missing SDK degrades gracefully.
# Install with:  pip install -e ".[speech]"
speech = [
    "google-cloud-speech>=2.26,<3.0",
]
# Live interview (experimental Gemini Live). Optional backend token minting; the
# SDK is imported lazily so a missing package degrades to the fallback.
# Install with:  pip install -e ".[live]"
live = [
    "google-genai>=0.8,<2.0",
]
# Production database tooling: Alembic migrations and the PostgreSQL driver.
# Development uses SQLite (bundled) and create_all; production runs migrations.
# Install with:  pip install -e ".[db]"
db = [
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
]
# Optional generation-quality evaluation with RAGAS. The deterministic retrieval
# harnesses are pure-Python and run on the base install; RAGAS is an OPTIONAL
# secondary layer (LLM-judged Faithfulness / Response Relevancy / Context
# Precision / Context Recall) that is never part of normal CI or the app runtime.
# The adapter lazy-imports RAGAS, so the base app runs without this group.
# Pinned to the 0.2.x API actually verified against this repo (ragas 0.2.15 with
# langchain 0.3.30 / langchain-core 0.3.86 / langchain-openai 0.3.35 / pydantic
# 2.13.5 / openai 2.54.0 on Python 3.11): SingleTurnSample / EvaluationDataset /
# metric classes / evaluate + Langchain*Wrapper. Floor at the tested 0.2.15 for
# reproducibility; cap below 0.3 so an unreviewed API change cannot slip in.
# langchain-openai is already a base dependency (evaluator wrapper) — pinned here
# to the same <0.4 range for consistency. Install with:  pip install -e ".[evaluation]"
evaluation = [
    "ragas>=0.2.15,<0.3",
    "langchain-openai>=0.2,<0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
